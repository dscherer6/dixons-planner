<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dixon's Planner</title>
<!-- Pick light or dark before the page draws, so it doesn't flash the wrong colors. Light is the default. -->
<script>try{document.documentElement.dataset.theme=localStorage.getItem("planner.theme")||"light";}catch(e){document.documentElement.dataset.theme="light";}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Inter:wght@400;500;600&display=swap">
<style>*,*::before,*::after{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Look: calm and minimal. Warm paper background, soft borders, serif headings, plenty of space.
   Every color is a named token here; dark mode swaps the same names below. */
:root{
  color-scheme:light;
  --bg:#F6F5F2; --surface:#FFFFFF; --sunk:#EFEDE8; --ink:#1E2124; --muted:#5C6168; --line:#E2DFD8;
  --accent:#33557A; --accent-ink:#FFFFFF; --warn:#94560F; --bad:#AE372B; --good:#3D7046;
  --c-fin345:#B0502C; --c-fin452:#86630F; --c-psy322:#3B7442; --c-psy335:#276D74; --c-wrt307:#6450A6; --c-other:#5C6168;
  --f-display:"Newsreader", "Iowan Old Style", Georgia, serif;
  --f-body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#121315; --surface:#1A1B1E; --sunk:#25262A; --ink:#ECEAE6; --muted:#A5A8AD; --line:#2F3135;
  --accent:#9FB8D6; --accent-ink:#121315; --warn:#E2A35E; --bad:#F08A7E; --good:#85C48F;
  --c-fin345:#F0936E; --c-fin452:#D9B35A; --c-psy322:#8CC593; --c-psy335:#77C2C8; --c-wrt307:#B3A3EE; --c-other:#A5A8AD;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1A1B1E; --sunk:#25262A; --ink:#ECEAE6; --muted:#A5A8AD; --line:#2F3135;
  --accent:#9FB8D6; --accent-ink:#121315; --warn:#E2A35E; --bad:#F08A7E; --good:#85C48F;
  --c-fin345:#F0936E; --c-fin452:#D9B35A; --c-psy322:#8CC593; --c-psy335:#77C2C8; --c-wrt307:#B3A3EE; --c-other:#A5A8AD;
  color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:20px 64px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:2.2rem;line-height:1.15}
h2{font-size:1.3rem}
h1:focus{outline:none}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:.82rem;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.brand{font-family:var(--f-display);font-size:1.15rem;text-decoration:none}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.who{display:flex;align-items:center;gap:10px;font-size:.88rem;color:var(--muted);min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* home greeting */
.hero{padding-block:clamp(24px,7vh,72px) 4px;display:flex;flex-direction:column;gap:6px}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:400;line-height:1.05}
.hero-date{margin:0;font-size:1.15rem;color:var(--muted)}

/* section nav (inside a section) */
.nav{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--sunk);border-radius:999px;align-self:flex-start;max-width:100%}
.nav a{padding:8px 16px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:500;font-size:.92rem;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

/* home tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;min-height:150px;padding:22px;border:1px solid var(--line);border-radius:18px;background:var(--surface);text-decoration:none}
.tile:hover{border-color:var(--muted)}
.tile-name{font-family:var(--f-display);font-size:1.55rem;line-height:1.1}
.tile-sub{color:var(--muted);font-size:.92rem}
.tile-sub .alert{color:var(--bad)}
.tile-go{margin-top:auto;align-self:flex-end;color:var(--muted);font-size:1.1rem}

/* quick add */
.qa{display:flex;flex-direction:column;gap:8px}
.qa-row{display:flex;gap:8px}
.qa input{flex:1;min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.qa input::placeholder{color:var(--muted)}
.qa-preview{display:flex;flex-wrap:wrap;gap:6px;min-height:24px;font-size:.84rem}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;background:var(--sunk);font-size:.82rem;white-space:nowrap}
.chip .sw{width:8px;height:8px;border-radius:50%}

/* buttons */
.btn{min-height:40px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.small{min-height:34px;padding:4px 12px;font-size:.88rem}
.btn:disabled{opacity:.6;cursor:default}

.banner{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-radius:var(--r);background:var(--sunk);font-size:.92rem}
#app{display:contents}

/* sign-in card */
.auth{max-width:440px;padding:24px;border:1px solid var(--line);border-radius:18px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
.auth p{margin:0}
.auth input{padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);font-size:1rem}

/* section headings */
.vhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.wk-nav{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wk-nav h1{flex:1;min-width:0}

/* today board */
.board{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:860px){.board{grid-template-columns:minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:22px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}

.class-row{display:flex;gap:12px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line)}
.class-row:first-of-type{border-top:0}
.class-row .code{font-size:.84rem;font-weight:600;min-width:64px}

.day-group{display:flex;flex-direction:column;gap:2px}
.day-h{display:flex;gap:10px;align-items:baseline;padding:10px 0 6px;border-bottom:1px solid var(--line)}
.day-h .d{font-family:var(--f-display);font-size:1.1rem}
.item{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 8px;border-radius:10px;cursor:pointer}
.item:hover{background:var(--sunk)}
.item .t{min-width:0}
.item .title{display:block;width:100%;padding:0;border:0;background:none;text-align:left;cursor:pointer;font-weight:500;overflow-wrap:anywhere}
.item .meta{font-size:.84rem;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.item.done .title{text-decoration:line-through;color:var(--muted)}
.check{appearance:none;width:20px;height:20px;margin:2px 0 0;border:1.5px solid var(--muted);border-radius:6px;cursor:pointer;display:grid;place-content:center;background:var(--surface)}
.check:checked{background:var(--accent);border-color:var(--accent)}
.check:checked::after{content:"";width:10px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tag{font-size:.74rem;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.tag.exam{color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.tag.project{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,var(--surface))}
.tag.other{color:var(--muted);background:var(--sunk)}
.ccode{font-size:.82rem;font-weight:600}

/* countdowns */
.cd{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;align-items:center;width:100%;padding:10px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.cd:first-of-type{border-top:0}
.cd .n{font-family:var(--f-display);font-size:2rem;line-height:1;text-align:right}
.cd .n small{display:block;font-family:var(--f-body);font-size:.72rem;color:var(--muted);margin-top:4px}
.cd .what{display:block;font-weight:500}
.cd .when{display:block;font-size:.84rem;color:var(--muted)}
.cd.soon .n{color:var(--bad)}

/* workload */
.heat{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px}
.heat .w{display:flex;flex-direction:column;gap:4px;align-items:center}
.heat .cell{width:100%;aspect-ratio:1;max-width:100%;border-radius:8px;background:var(--sunk);display:grid;place-content:center;font-size:.84rem;font-weight:500;font-variant-numeric:tabular-nums}
.heat .wl{font-size:.68rem;color:var(--muted);white-space:nowrap}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:860px){.week{grid-template-columns:minmax(0,1fr)}}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;min-height:160px;min-width:0}
.wday.today{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.wday .wh{display:flex;justify-content:space-between;align-items:baseline}
.wday .wh b{font-family:var(--f-display);font-weight:500;font-size:1.05rem}
.ev{display:block;width:100%;text-align:left;font-size:.84rem;padding:6px 8px;border:0;border-left:3px solid var(--cc);border-radius:6px;background:color-mix(in srgb,var(--cc) 9%,var(--surface));cursor:pointer;overflow-wrap:anywhere}
.ev.cls{background:transparent;border-left-style:dotted;cursor:default;color:var(--muted)}
.ev.off{text-decoration:line-through}
.ev.done{text-decoration:line-through;color:var(--muted)}
.ev .ec{font-size:.74rem;font-weight:600;color:var(--cc)}

/* month */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.mh{font-size:.78rem;color:var(--muted);text-align:center;padding:4px 0}
.mday{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-height:100px;padding:6px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0;text-align:left}
.mday.out{background:transparent}
.mday.out .mn{color:var(--muted)}
.mday.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.mday[aria-pressed="true"]{outline:2px solid var(--accent);outline-offset:1px}
.mday .mn{font-size:.82rem;font-variant-numeric:tabular-nums}
.mpill{font-size:.72rem;line-height:1.25;padding:2px 5px;border-radius:4px;background:color-mix(in srgb,var(--cc) 13%,var(--surface));color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpill.exam{font-weight:600;box-shadow:inset 2px 0 0 var(--cc)}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cc)}
@media (max-width:620px){.mpill{display:none}.mday{min-height:54px}}
@media (min-width:621px){.dots{display:none}}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fchip{min-height:36px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:.88rem;display:inline-flex;gap:6px;align-items:center}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* courses */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.course{border-top:4px solid var(--cc)}
.course .f{display:grid;grid-template-columns:72px minmax(0,1fr);gap:8px;align-items:center;font-size:.9rem}
.course input{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);min-width:0;width:100%}

/* edit sheet */
.scrim{position:fixed;inset:0;background:color-mix(in srgb,#000 40%,transparent);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);border-radius:18px;padding:22px;width:min(540px,100%);max-height:90%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.sheet label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted)}
.sheet input,.sheet select,.sheet textarea{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-size:1rem}
.sheet .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet .acts{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(24px,calc(env(safe-area-inset-bottom,0px) + 12px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;z-index:30;opacity:0;pointer-events:none}
.toast.show{opacity:1}
.empty{padding:16px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:.92rem}

/* bigger targets on touch screens */
@media (pointer:coarse){.btn{min-height:44px}.btn.small{min-height:40px}.check{width:24px;height:24px}.nav a{padding:11px 16px}.fchip{min-height:40px}}
@media (prefers-reduced-motion:no-preference){.item,.ev,.btn,.fchip,.tile,.nav a{transition:background .15s,border-color .15s,color .15s}.toast{transition:opacity .2s}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#home">Dixon's Planner</a>
    <div class="top-right">
      <div class="who" id="who" hidden><span id="whoEmail"></span><button class="btn small" id="signOut" type="button">Sign out</button></div>
      <button class="btn small" id="themeBtn" type="button">Dark mode</button>
    </div>
  </header>

  <section class="hero" id="hero">
    <h1 id="greet" tabindex="-1">Hello</h1>
    <p class="hero-date" id="todayLabel"></p>
  </section>

  <form class="auth" id="auth" hidden autocomplete="on">
    <h2>Sign in</h2>
    <p class="muted" id="authMsg">Enter your email and we'll send you a sign-in link. No password needed.</p>
    <label class="sr" for="authEmail">Email</label>
    <input type="email" id="authEmail" placeholder="you@example.com" required>
    <button class="btn primary" type="submit" id="authBtn">Email me a sign-in link</button>
  </form>

  <div id="app" hidden>
  <nav class="nav" id="nav" aria-label="Sections">
    <a href="#home">Home</a>
    <a href="#today">Today</a>
    <a href="#week">Week</a>
    <a href="#month">Month</a>
    <a href="#tasks">All tasks</a>
    <a href="#courses">Courses</a>
  </nav>

  <form class="qa" id="qaForm" autocomplete="off">
    <div class="qa-row">
      <label class="sr" for="qaInput">Quick add</label>
      <input id="qaInput" placeholder="Quick add: “FIN 345 IPO notes fri 5pm” or “psy322 quiz 10/26”" aria-describedby="qaPreview">
      <button class="btn primary" type="submit">Add</button>
    </div>
    <div class="qa-preview" id="qaPreview"></div>
  </form>

  <div class="banner" id="banner" hidden></div>
  <main id="view"></main>
  </div>
</div>
<div id="sheetHost"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- data/seed.js exists only on Dixon's Mac (it's gitignored); online it's missing and the app just skips it. -->
<script src="data/seed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
(function(){
// Sections live in the URL hash (#today, #week, …) so links and the Back button work.
const VIEWS=["home","today","week","month","tasks","courses"];
const viewFromHash=()=>{const v=location.hash.slice(1);return VIEWS.includes(v)?v:"home";};
const S = { courses:{}, items:{}, view:viewFromHash(), weekOff:0, monthOff:0, selDay:null, filter:"all", showDone:false, loaded:false, db:null, canWrite:true };

const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n=>String(n).padStart(2,"0");
const ymd = d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse = s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const today=()=>ymd(new Date());
const DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DAYS=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const fmtDay=s=>{const d=parse(s);return DOW[d.getDay()]+" "+MON[d.getMonth()]+" "+d.getDate();};
const fmtLong=s=>{const d=parse(s);return DAYS[d.getDay()]+", "+MONTHS[d.getMonth()]+" "+d.getDate();};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());const k=(x.getDay()+6)%7;return addDays(x,-k);};
const daysBetween=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const fmtTime=t=>{if(!t)return"";const [h,m]=t.split(":").map(Number);const ap=h>=12?"pm":"am";const hh=((h+11)%12)+1;return hh+(m?":"+pad(m):"")+ap;};
const plural=(n,one,many)=>n+" "+(n===1?one:many);
const KIND={exam:"Exam",project:"Project",hw:"Homework",quiz:"Quiz",reading:"Reading",task:"To-do"};
const WEIGHT={exam:3,project:2};

function cc(code){const c=S.courses[code];return c?`var(--c-${code})`:"var(--c-other)";}
function cname(code){const c=S.courses[code];return c?c.code:(code||"General");}
function itemsArr(){return Object.entries(S.items).map(([id,v])=>({id,...v}));}
function sortItems(a,b){return (a.date||"9999").localeCompare(b.date||"9999")||(a.time||"99").localeCompare(b.time||"99")||(WEIGHT[b.kind]||1)-(WEIGHT[a.kind]||1);}
function sessionsOn(date){
  const out=[];
  for(const [code,c] of Object.entries(S.courses)){ for(const s of (c.sessions||[])) if(s.d===date) out.push({code,course:c,...s}); }
  return out.sort((a,b)=>(a.course.order||0)-(b.course.order||0));
}
function greeting(){const h=new Date().getHours();return h<5?"Good night":h<12?"Good morning":h<17?"Good afternoon":h<21?"Good evening":"Good night";}

/* ---------- rendering ---------- */
function tagHtml(k){const cls=k==="exam"?"exam":k==="project"?"project":"other";return `<span class="tag ${cls}">${esc(KIND[k]||k)}</span>`;}
function itemRow(it,showDate){
  const late=!it.done&&it.date&&it.date<today();
  return `<div class="item ${it.done?"done":""}" data-open="${esc(it.id)}">
    <input type="checkbox" class="check" data-toggle="${esc(it.id)}" ${it.done?"checked":""} aria-label="Done: ${esc(it.title)}">
    <div class="t"><button type="button" class="title" data-open="${esc(it.id)}">${esc(it.title)}</button>
      <div class="meta"><span class="ccode" style="color:${cc(it.course)}">${esc(cname(it.course))}</span>
      ${showDate&&it.date?`<span class="mono" style="${late?"color:var(--bad)":""}">${late?"Overdue · ":""}${fmtDay(it.date)}</span>`:""}
      ${it.time?`<span class="mono">${fmtTime(it.time)}</span>`:""}
      ${it.detail?`<span>${esc(it.detail)}</span>`:""}</div></div>
    ${tagHtml(it.kind)}
  </div>`;
}
function dayGroups(list){
  const by={};list.forEach(i=>{(by[i.date||"TBD"]??=[]).push(i);});
  return Object.keys(by).sort().map(d=>{
    const rel=d==="TBD"?"":d===today()?"Today":daysBetween(today(),d)===1?"Tomorrow":"";
    return `<div class="day-group"><h3 class="day-h"><span class="d">${d==="TBD"?"Date TBD":fmtDay(d)}</span><span class="label">${rel}</span></h3>${by[d].map(i=>itemRow(i,false)).join("")}</div>`;
  }).join("");
}
function emptyState(msg){return `<div class="empty">${msg}</div>`;}

function vHome(){
  if(!S.loaded) return emptyState("Loading your planner…");
  const t=today(), open=itemsArr().filter(i=>!i.done);
  const dueToday=open.filter(i=>i.date===t).length, classes=sessionsOn(t).filter(s=>!s.off).length;
  const m=monday(new Date()), wa=ymd(m), wb=ymd(addDays(m,6));
  const wk=open.filter(i=>i.date&&i.date>=wa&&i.date<=wb).length;
  const now=new Date(), ma=ymd(new Date(now.getFullYear(),now.getMonth(),1)), mb=ymd(new Date(now.getFullYear(),now.getMonth()+1,0));
  const mo=open.filter(i=>i.date&&i.date>=ma&&i.date<=mb).length;
  const overdue=open.filter(i=>i.date&&i.date<t).length;
  const nc=Object.keys(S.courses).length;
  const todaySub=[dueToday?plural(dueToday,"item","items")+" due":"Nothing due",classes?plural(classes,"class","classes"):""].filter(Boolean).join(" · ");
  const tiles=[
    ["today","Today",esc(todaySub)],
    ["week","This week",wk?plural(wk,"open item","open items"):"All clear"],
    ["month",MONTHS[now.getMonth()],mo?plural(mo,"open item","open items"):"All clear"],
    ["tasks","All tasks",plural(open.length,"open","open")+(overdue?` · <span class="alert">${overdue} overdue</span>`:"")],
    ["courses","Courses",plural(nc,"course","courses")],
  ];
  return `<nav class="tiles" aria-label="Sections">${tiles.map(([v,name,sub])=>`<a class="tile" href="#${v}"><span class="tile-name">${name}</span><span class="tile-sub">${sub}</span><span class="tile-go" aria-hidden="true">→</span></a>`).join("")}</nav>`;
}

function vToday(){
  const t=today(), all=itemsArr().sort(sortItems);
  const overdue=all.filter(i=>!i.done&&i.date&&i.date<t);
  const end=ymd(addDays(parse(t),7));
  const upcoming=all.filter(i=>i.date&&i.date>=t&&i.date<=end&&(!i.done||i.date===t));
  const tbd=all.filter(i=>!i.date&&!i.done);
  const cls=sessionsOn(t);
  const exams=all.filter(i=>i.kind==="exam"&&!i.done&&i.date&&i.date>=t).slice(0,6);
  const head=`<div class="vhead"><h1 tabindex="-1">Today</h1><span class="muted">${fmtLong(t)}</span></div>`;
  if(!S.loaded) return head+emptyState("Loading your schedule…");
  if(!all.length&&!Object.keys(S.courses).length) return head+emptyState("Nothing here yet. Add your first item with Quick add above, or ask Claude to load a syllabus.");
  // workload: weighted item count per week for the next 8 weeks
  const m0=monday(new Date());let heat="";
  for(let w=0;w<8;w++){
    const a=ymd(addDays(m0,w*7)),b=ymd(addDays(m0,w*7+6));
    const its=all.filter(i=>i.date&&i.date>=a&&i.date<=b);
    const load=its.reduce((s,i)=>s+(WEIGHT[i.kind]||1),0);
    const pct=Math.min(85,load*7);
    const ex=its.filter(i=>i.kind==="exam").length;
    heat+=`<div class="w"><div class="cell" aria-hidden="true" style="background:color-mix(in srgb,var(--accent) ${pct}%,var(--sunk));color:${pct>45?"var(--accent-ink)":"var(--ink)"}">${its.length}</div><span class="wl">${MON[parse(a).getMonth()]} ${parse(a).getDate()}</span><span class="sr">: ${plural(its.length,"item","items")}, ${plural(ex,"exam","exams")}</span></div>`;
  }
  return head+`<div class="board">
   <div class="col">
    ${overdue.length?`<section class="panel"><div class="panel-h"><h2 style="color:var(--bad)">Overdue</h2><span class="label">${overdue.length}</span></div>${overdue.map(i=>itemRow(i,true)).join("")}</section>`:""}
    <section class="panel"><div class="panel-h"><h2>Classes today</h2></div>
      ${cls.length?cls.map(s=>`<div class="class-row"><span class="code" style="color:${cc(s.code)}">${esc(s.course.code)}</span><div style="min-width:0">${s.off?`<s class="muted">${esc(s.t)}</s>`:esc(s.t)}${s.r?` <span class="muted">· ${esc(s.r)}</span>`:""}${s.course.time&&!s.off?` <span class="mono muted">· ${esc(s.course.time)}</span>`:""}${s.course.room&&!s.off?` <span class="muted">· ${esc(s.course.room)}</span>`:""}</div></div>`).join(""):`<div class="muted">No classes today.</div>`}
    </section>
    <section class="panel"><div class="panel-h"><h2>Next 7 days</h2><span class="label">${upcoming.filter(i=>!i.done).length} open</span></div>
      ${upcoming.length?dayGroups(upcoming):`<div class="muted">Nothing due this week.</div>`}
    </section>
   </div>
   <div class="col">
    <section class="panel"><div class="panel-h"><h2>Exam countdown</h2></div>
      ${exams.length?exams.map(e=>{const n=daysBetween(t,e.date);return `<button type="button" class="cd ${n<=3?"soon":""}" data-open="${esc(e.id)}"><span class="n">${n===0?"Now":n}<small>${n===0?"today":n===1?"day":"days"}</small></span><span style="min-width:0"><span class="what">${esc(e.title)}</span><span class="when"><span class="ccode" style="color:${cc(e.course)}">${esc(cname(e.course))}</span> · <span class="mono">${fmtDay(e.date)}${e.time?" "+fmtTime(e.time):""}</span></span></span></button>`}).join(""):`<div class="muted">No exams scheduled.</div>`}
    </section>
    <section class="panel"><div class="panel-h"><h2>Workload ahead</h2><span class="label">items per week</span></div>
      <div class="heat">${heat}</div>
      <div class="muted" style="font-size:.84rem">Darker weeks are heavier. Exams count 3×, projects 2×.</div>
    </section>
    ${tbd.length?`<section class="panel"><div class="panel-h"><h2>Date TBD</h2><span class="label">${tbd.length}</span></div>${tbd.map(i=>itemRow(i,false)).join("")}</section>`:""}
   </div></div>`;
}

function evHtml(date){
  const ses=sessionsOn(date).map(s=>`<div class="ev cls ${s.off?"off":""}" style="--cc:${cc(s.code)}"><span class="ec">${esc(s.course.code)}${s.course.time&&!s.off?" · "+esc(s.course.time):""}</span> ${s.off?`<span class="sr">No class: </span>`:""}${esc(s.t)}</div>`);
  const its=itemsArr().filter(i=>i.date===date).sort(sortItems).map(i=>`<button type="button" class="ev ${i.done?"done":""}" style="--cc:${cc(i.course)}" data-open="${esc(i.id)}"><span class="ec">${esc(cname(i.course))}${i.time?" · "+fmtTime(i.time):""}</span><br>${i.kind==="exam"?"<b>":""}${esc(i.title)}${i.kind==="exam"?"</b>":""}${i.done?`<span class="sr"> (done)</span>`:""}</button>`);
  return its.join("")+ses.join("");
}
function vWeek(){
  const m=addDays(monday(new Date()),S.weekOff*7);const t=today();
  let cols="";for(let i=0;i<7;i++){const dd=addDays(m,i),d=ymd(dd);cols+=`<section class="wday ${d===t?"today":""}" aria-label="${fmtLong(d)}${d===t?", today":""}"><div class="wh"><b>${DOW[dd.getDay()]}</b><span class="mono muted">${MON[dd.getMonth()]} ${dd.getDate()}</span></div>${evHtml(d)||`<span class="muted" style="font-size:.84rem">—</span>`}</section>`;}
  return `<div class="col"><div class="wk-nav"><h1 tabindex="-1">Week of ${fmtDay(ymd(m))}</h1><button class="btn small" data-wk="-1" aria-label="Previous week">←</button><button class="btn small" data-wk="0">This week</button><button class="btn small" data-wk="1" aria-label="Next week">→</button></div><div class="week">${cols}</div></div>`;
}
function vMonth(){
  const now=new Date();const first=new Date(now.getFullYear(),now.getMonth()+S.monthOff,1);
  const start=monday(first);const t=today();const its=itemsArr();
  let cells=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="mh" aria-hidden="true">${d}</div>`).join("");
  for(let i=0;i<42;i++){const dd=addDays(start,i);const d=ymd(dd);
    if(i>=35&&dd.getMonth()!==first.getMonth())break;
    const di=its.filter(x=>x.date===d).sort(sortItems);
    const lbl=fmtLong(d)+(d===t?", today":"")+(di.length?", "+plural(di.length,"item","items"):"");
    cells+=`<button class="mday ${dd.getMonth()!==first.getMonth()?"out":""} ${d===t?"today":""}" data-day="${d}" aria-pressed="${S.selDay===d}" aria-label="${lbl}"><span class="mn">${dd.getDate()}</span>${di.slice(0,3).map(x=>`<span class="mpill ${x.kind==="exam"?"exam":""}" style="--cc:${cc(x.course)}">${esc(x.title)}</span>`).join("")}${di.length>3?`<span class="mpill" style="--cc:var(--c-other)">+${di.length-3} more</span>`:""}<span class="dots">${di.map(x=>`<span class="dot" style="--cc:${cc(x.course)}"></span>`).join("")}</span></button>`;}
  const sel=S.selDay?`<section class="panel" aria-live="polite"><div class="panel-h"><h2>${fmtLong(S.selDay)}</h2></div>${evHtml(S.selDay)||`<div class="muted">Nothing on this day.</div>`}</section>`:"";
  return `<div class="col"><div class="wk-nav"><h1 tabindex="-1">${MONTHS[first.getMonth()]} ${first.getFullYear()}</h1><button class="btn small" data-mo="-1" aria-label="Previous month">←</button><button class="btn small" data-mo="0">Today</button><button class="btn small" data-mo="1" aria-label="Next month">→</button></div><div class="month">${cells}</div>${sel}</div>`;
}
function vTasks(){
  const codes=Object.values(S.courses).sort((a,b)=>(a.order||0)-(b.order||0));
  let list=itemsArr().sort(sortItems);
  if(S.filter!=="all") list=list.filter(i=>i.course===S.filter);
  if(!S.showDone) list=list.filter(i=>!i.done);
  const chips=`<button class="fchip" data-f="all" aria-pressed="${S.filter==="all"}">All</button>`+codes.map(c=>`<button class="fchip" data-f="${esc(c.id)}" aria-pressed="${S.filter===c.id}"><span class="chip sw" style="background:${cc(c.id)};padding:0"></span>${esc(c.code)}</button>`).join("");
  return `<div class="col"><div class="vhead"><h1 tabindex="-1">All tasks</h1></div><div class="filters" role="group" aria-label="Filter by course">${chips}<label class="fchip" style="margin-left:auto"><input type="checkbox" id="showDone" ${S.showDone?"checked":""}> Show done</label></div>
  <section class="panel">${list.length?dayGroups(list):emptyState("No open items for this filter.")}</section></div>`;
}
function vCourses(){
  const cs=Object.values(S.courses).sort((a,b)=>(a.order||0)-(b.order||0));const t=today();
  const head=`<div class="vhead"><h1 tabindex="-1">Courses</h1></div>`;
  if(!cs.length) return head+emptyState(S.loaded?"No courses yet.":"Loading…");
  return `<div class="col">${head}<div class="cgrid">${cs.map(c=>{const open=itemsArr().filter(i=>i.course===c.id&&!i.done);const next=open.filter(i=>i.date&&i.date>=t).sort(sortItems)[0];
    return `<section class="panel course" style="--cc:${cc(c.id)}"><div><div class="ccode" style="color:${cc(c.id)}">${esc(c.code)}</div><h2>${esc(c.name)}</h2></div>
    <div class="f"><span class="label">Meets</span><span>${esc(c.days||"")}</span></div>
    <div class="f"><label class="label" for="time-${esc(c.id)}">Time</label><input id="time-${esc(c.id)}" data-cf="time" data-c="${esc(c.id)}" value="${esc(c.time||"")}" placeholder="e.g. 11:00–12:20"></div>
    <div class="f"><label class="label" for="room-${esc(c.id)}">Room</label><input id="room-${esc(c.id)}" data-cf="room" data-c="${esc(c.id)}" value="${esc(c.room||"")}" placeholder="Building + room"></div>
    ${c.note?`<div class="muted" style="font-size:.88rem">${esc(c.note)}</div>`:""}
    <div class="f"><span class="label">Open</span><span class="mono">${plural(open.length,"item","items")}</span></div>
    <div class="f"><span class="label">Next</span><span>${next?esc(next.title)+` <span class="mono muted">${fmtDay(next.date)}</span>`:"—"}</span></div></section>`;}).join("")}</div></div>`;

  $("#greet").textContent=greeting();

function render(){
  const home=S.view==="home";

/* ---------- writes ---------- */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2200);}
async function write(fn,ok){
  if(!S.db){toast("Saving isn't available in this view.");return false;}
  try{await fn();if(ok)toast(ok);return true;}catch(e){toast(e&&e.code==="invalid_argument"?"You can view this planner but not edit it.":"Couldn't save. Try again.");return false;}
}
async function toggle(id,done){
  S.items[id]={...S.items[id],done};render();
  await write(()=>S.db.doc("items/"+id).update({done,doneAt:done?today():null}),done?"Marked done":"Reopened");
}

/* ---------- quick add parser ---------- */
function parseQA(text){
  let s=" "+text+" ";const out={course:"",kind:"task",date:"",time:""};
  const codeRe=/\b(fin|psy|wrt)\s?-?(\d{3})\b/i;let m=s.match(codeRe);
  if(m){const id=(m[1]+m[2]).toLowerCase();if(S.courses[id]){out.course=id;s=s.replace(m[0]," ");}}
  if(!out.course){for(const id of Object.keys(S.courses)){const num=id.slice(-3);const r=new RegExp("\\b"+num+"\\b");if(r.test(s)){out.course=id;s=s.replace(r," ");break;}}}
  m=s.match(/\b(\d{1,2})(?::(\d{2}))?\s?(am|pm)\b/i);
  if(m){let h=+m[1]%12;if(m[3].toLowerCase()==="pm")h+=12;out.time=pad(h)+":"+(m[2]||"00");s=s.replace(m[0]," ");}
  else if((m=s.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/))){out.time=pad(+m[1])+":"+m[2];s=s.replace(m[0]," ");}
  const base=new Date();base.setHours(0,0,0,0);
  if((m=s.match(/\b(today|tonight)\b/i))){out.date=ymd(base);s=s.replace(m[0]," ");}
  else if((m=s.match(/\b(tomorrow|tmrw|tmr)\b/i))){out.date=ymd(addDays(base,1));s=s.replace(m[0]," ");}
  else if((m=s.match(/\b(\d{1,2})\/(\d{1,2})\b/))){let y=base.getFullYear();let d=new Date(y,+m[1]-1,+m[2]);if(d<addDays(base,-60))d=new Date(y+1,+m[1]-1,+m[2]);out.date=ymd(d);s=s.replace(m[0]," ");}
  else if((m=s.match(/\b(jan|feb|mar|apr|may|jun|jul|aug|sep|sept|oct|nov|dec)[a-z]*\.?\s+(\d{1,2})\b/i))){const mi=MON.findIndex(x=>x.toLowerCase()===m[1].slice(0,3).toLowerCase());let d=new Date(base.getFullYear(),mi,+m[2]);if(d<addDays(base,-60))d.setFullYear(d.getFullYear()+1);out.date=ymd(d);s=s.replace(m[0]," ");}
  else if((m=s.match(/\b(next\s+)?(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)[a-z]*\b/i))){const wi=["sun","mon","tue","wed","thu","fri","sat"].indexOf(m[2].slice(0,3).toLowerCase());let k=(wi-base.getDay()+7)%7;if(m[1])k+=k===0?7:7;out.date=ymd(addDays(base,k));s=s.replace(m[0]," ");}
  const k=s.toLowerCase();
  if(/\b(exam|midterm|final|test|quest)\b/.test(k))out.kind="exam";
  else if(/\bquiz\b/.test(k))out.kind="quiz";
  else if(/\b(hw|homework|problem set|pset|cow|packback)\b/.test(k))out.kind="hw";
  else if(/\b(project|paper|essay|draft|case|presentation)\b/.test(k))out.kind="project";
  else if(/\b(read|reading|chapter|ch\.?)\b/.test(k))out.kind="reading";
  out.title=s.replace(/\s+/g," ").trim()||text.trim();
  return out;
}
function qaPreview(){
  const v=$("#qaInput").value.trim();const p=$("#qaPreview");
  if(!v){p.innerHTML=`<span class="muted">Type a course, a day (fri, 10/26, tomorrow) and a time (5pm). Press Enter to add.</span>`;return;}
  const r=parseQA(v);
  p.innerHTML=`<span class="chip"><b>${esc(r.title)}</b></span><span class="chip"><span class="sw" style="background:${cc(r.course)}"></span>${esc(r.course?cname(r.course):"No course")}</span><span class="chip">${r.date?fmtDay(r.date):"No date"}</span>${r.time?`<span class="chip">${fmtTime(r.time)}</span>`:""}<span class="chip">${KIND[r.kind]}</span>`;
}

/* ---------- edit sheet ---------- */
let closeSheet=null;
function openSheet(id){
  const opener=document.activeElement;
  const it=id?S.items[id]:{title:"",course:"",kind:"task",date:today(),time:"",detail:"",done:false};
  const opts=Object.values(S.courses).sort((a,b)=>(a.order||0)-(b.order||0)).map(c=>`<option value="${esc(c.id)}" ${it.course===c.id?"selected":""}>${esc(c.code)} · ${esc(c.name)}</option>`).join("");
  $("#sheetHost").innerHTML=`<div class="scrim" id="scrim"><form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">${id?"Edit item":"New item"}</h2>
    <label>Title<input id="f-title" value="${esc(it.title)}" required></label>
    <div class="row"><label>Course<select id="f-course"><option value="">General</option>${opts}</select></label>
    <label>Type<select id="f-kind">${Object.entries(KIND).map(([k,v])=>`<option value="${k}" ${it.kind===k?"selected":""}>${v}</option>`).join("")}</select></label></div>
    <div class="row"><label>Date<input type="date" id="f-date" value="${esc(it.date||"")}"></label><label>Time<input type="time" id="f-time" value="${esc(it.time||"")}"></label></div>
    <label>Notes<textarea id="f-detail" rows="3">${esc(it.detail||"")}</textarea></label>
    <label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" class="check" id="f-done" ${it.done?"checked":""}> Done</label>
    <div class="acts"><div>${id?`<button type="button" class="btn danger" id="f-del">Delete</button>`:""}</div><div style="display:flex;gap:8px"><button type="button" class="btn" id="f-cancel">Cancel</button><button class="btn primary" type="submit">Save</button></div></div>
  </form></div>`;
  // Closing puts keyboard focus back where it was (or on the page heading if that spot was redrawn).
  const close=closeSheet=()=>{$("#sheetHost").innerHTML="";closeSheet=null;
    if(opener&&document.contains(opener))opener.focus();else $("#view h1")?.focus();};
  const sheet=$("#sheet");
  $("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")close();});
  // Keep Tab inside the dialog while it's open.
  sheet.addEventListener("keydown",e=>{if(e.key!=="Tab")return;const f=[...sheet.querySelectorAll("input,select,textarea,button")];const a=f[0],z=f[f.length-1];
    if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus();}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus();}});
  $("#f-cancel").onclick=close;
  $("#f-title").focus();
  const del=$("#f-del");
  if(del) del.onclick=async()=>{ if(del.dataset.armed){ delete S.items[id];close();render();await write(()=>S.db.doc("items/"+id).delete(),"Deleted"); } else { del.dataset.armed="1";del.textContent="Tap again to delete"; } };
  sheet.addEventListener("submit",async e=>{e.preventDefault();
    const data={title:$("#f-title").value.trim(),course:$("#f-course").value,kind:$("#f-kind").value,date:$("#f-date").value||null,time:$("#f-time").value||"",detail:$("#f-detail").value.trim(),done:$("#f-done").checked};
    if(!data.title)return;
    const docId=id||("u-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    const prev=S.items[docId]||{};const full={...prev,...data,updatedAt:new Date().toISOString()};
    if(!id) full.createdAt=new Date().toISOString();
    S.items[docId]=full;render();close();
    await write(()=>S.db.doc("items/"+docId).set(full),"Saved");
  });
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&closeSheet)closeSheet();});

/* ---------- events ---------- */
window.addEventListener("hashchange",()=>{S.view=viewFromHash();render();window.scrollTo(0,0);($("#view h1")||$("#greet")).focus({preventScroll:true});});
$("#view").addEventListener("click",e=>{
  const tg=e.target.closest("[data-toggle]");if(tg){e.stopPropagation();toggle(tg.dataset.toggle,tg.checked);return;}
  const o=e.target.closest("[data-open]");if(o){openSheet(o.dataset.open);return;}
  const wk=e.target.closest("[data-wk]");if(wk){S.weekOff=+wk.dataset.wk===0?0:S.weekOff+ +wk.dataset.wk;render();return;}
  const mo=e.target.closest("[data-mo]");if(mo){S.monthOff=+mo.dataset.mo===0?0:S.monthOff+ +mo.dataset.mo;if(+mo.dataset.mo===0)S.selDay=today();render();return;}
  const dy=e.target.closest("[data-day]");if(dy){S.selDay=dy.dataset.day;render();$(`[data-day="${S.selDay}"]`)?.focus();return;}
  const f=e.target.closest("[data-f]");if(f){S.filter=f.dataset.f;render();$(`[data-f="${S.filter}"]`)?.focus();return;}
});
$("#view").addEventListener("change",async e=>{
  if(e.target.id==="showDone"){S.showDone=e.target.checked;render();$("#showDone")?.focus();return;}
  const cf=e.target.dataset.cf;if(cf){const id=e.target.dataset.c;const val=e.target.value.trim();S.courses[id]={...S.courses[id],[cf]:val};await write(()=>S.db.doc("courses/"+id).update({[cf]:val}),"Saved");}
});
$("#qaInput").addEventListener("input",qaPreview);
$("#qaForm").addEventListener("submit",async e=>{e.preventDefault();const v=$("#qaInput").value.trim();if(!v)return;
  const r=parseQA(v);const id="u-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const data={title:r.title,course:r.course,kind:r.kind,date:r.date||null,time:r.time,detail:"",done:false,createdAt:new Date().toISOString()};
  S.items[id]=data;$("#qaInput").value="";qaPreview();render();
  await write(()=>S.db.doc("items/"+id).set(data),"Added "+(r.date?"for "+fmtDay(r.date):"(no date)"));
});

/* ---------- light / dark ---------- */
// The colors for each live in the :root[data-theme] blocks at the top; this just flips which one is on.
function paintTheme(){$("#themeBtn").textContent=document.documentElement.dataset.theme==="dark"?"Light mode":"Dark mode";}
$("#themeBtn").onclick=()=>{
  const next=document.documentElement.dataset.theme==="dark"?"light":"dark";
  document.documentElement.dataset.theme=next;
  try{localStorage.setItem("planner.theme",next);}catch(e){}
  paintTheme();
};
paintTheme();

/* ---------- boot ---------- */
qaPreview();render();
// Every minute: refresh the greeting, and redraw everything when the day changes.
setInterval(()=>{if(S.lastDay!==today()){S.lastDay=today();render();}else paintHero();},60000);S.lastDay=today();
// ---- Storage: Supabase. Row-level security means each signed-in user only sees their own rows. ----
const SUPABASE_URL="https://xxduaykitaegdbqwzvgf.supabase.co";
const SUPABASE_KEY="sb_publishable_pNwBnRNEreo_LlJ9uxEWjQ_v1tCnmlc"; // publishable key: safe in the browser
if(!window.supabase){$("#auth").hidden=false;$("#authMsg").textContent="Couldn't reach the internet. Check your connection and reload.";$("#authBtn").disabled=true;return;}
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

// The app uses camelCase fields; the tables use snake_case columns. These two functions translate.
const COLS={courses:["code","name","days","time","room","note","order","sessions"],
            items:["course","title","kind","date","time","detail","done","source"]};
const RENAME={doneAt:"done_at",createdAt:"created_at"};
function toRow(col,d){
  const r={};
  for(const [k,v] of Object.entries(d)){
    if(COLS[col].includes(k)) r[k]=v;
    else if(col==="items"&&RENAME[k]) r[RENAME[k]]=v;
  }
  r.updated_at=new Date().toISOString();
  return r;
}
function fromRow(col,r){
  const {user_id,updated_at,created_at,done_at,area,...rest}=r;
  return col==="items"?{...rest,doneAt:done_at,createdAt:created_at,updatedAt:updated_at}:rest;
}
// Same doc("items/id").set/update/delete shape the rest of the app already calls.
const SupaDB={doc(path){const [col,id]=path.split("/");
  const run=async p=>{const {error}=await p;if(error)throw error;};
  return{
    set:d=>run(sb.from(col).upsert({user_id:S.user.id,id,...toRow(col,d)})),
    update:p=>run(sb.from(col).update(toRow(col,p)).eq("id",id)),
    delete:()=>run(sb.from(col).delete().eq("id",id))};}};

async function load(){
  const [c,i]=await Promise.all([sb.from("courses").select("*"),sb.from("items").select("*")]);
  if(c.error||i.error){toast("Couldn't load your planner. Check your connection.");return;}
  S.courses={};for(const r of c.data)S.courses[r.id]=fromRow("courses",r);
  S.items={};for(const r of i.data)S.items[r.id]=fromRow("items",r);
  S.loaded=true;render();showImport();
}

// One-time import: only offered when the account is empty and this computer has data/seed.js.
function showImport(){
  const b=$("#banner"),seed=window.SEED;
  const empty=!Object.keys(S.courses).length&&!Object.keys(S.items).length;
  if(!(empty&&seed)){b.hidden=true;return;}
  const nc=Object.keys(seed.courses||{}).length,ni=Object.keys(seed.items||{}).length;
  b.innerHTML=`<span>Your account is empty. Copy your ${nc} courses and ${ni} items from this computer into it?</span><button class="btn primary small" id="importBtn" type="button">Import</button>`;
  b.hidden=false;
  $("#importBtn").onclick=async()=>{
    const btn=$("#importBtn");btn.disabled=true;btn.textContent="Importing…";
    const uid=S.user.id;
    const cs=Object.entries(seed.courses||{}).map(([id,c])=>({user_id:uid,id,...toRow("courses",c)}));
    const is=Object.entries(seed.items||{}).map(([id,it])=>({user_id:uid,id,...toRow("items",it)}));
    const r1=await sb.from("courses").upsert(cs,{defaultToNull:false});
    const r2=r1.error?r1:await sb.from("items").upsert(is,{defaultToNull:false});
    if(r2.error){btn.disabled=false;btn.textContent="Try again";toast("Import failed: "+r2.error.message);return;}
    toast(`Imported ${nc} courses and ${ni} items`);await load();
  };
}

// ---- Sign-in: email magic link. ----
async function showSession(session){
  const user=session?.user||null;
  if(user&&user.id===S.user?.id&&S.loaded)return; // token refresh, nothing to reload
  S.user=user;
  $("#auth").hidden=!!user;$("#app").hidden=!user;$("#who").hidden=!user;
  if(user){$("#whoEmail").textContent=user.email;S.db=SupaDB;S.loaded=false;render();await load();}
  else{S.db=null;S.courses={};S.items={};S.loaded=false;$("#banner").hidden=true;render();}
}
// Supabase advises not awaiting its own calls inside this callback, so hand off with setTimeout.
sb.auth.onAuthStateChange((_e,session)=>setTimeout(()=>showSession(session),0));
if(location.protocol==="file:")$("#authMsg").textContent="Sign-in links can't open a double-clicked file. Use the website instead, or ask Claude to start the local server.";
$("#auth").addEventListener("submit",async e=>{e.preventDefault();
  const email=$("#authEmail").value.trim();if(!email)return;
  const btn=$("#authBtn");btn.disabled=true;btn.textContent="Sending…";
  const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  btn.disabled=false;btn.textContent="Email me a sign-in link";
  $("#authMsg").textContent=error?"Couldn't send the link: "+error.message:`Check ${email} for a "Sign in" link and open it on this device.`;
});
$("#signOut").onclick=()=>sb.auth.signOut();
// Coming back to the tab (e.g. after editing on another device) pulls the latest data.
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.user)load();});
})();
</script>
